# Managed by KaratDesk. Other server-level Certbot settings stay in the site file.
# Keep this existing v2 asset path: upgrades do not require a new Nginx workaround.
location ^~ /assets/ {
  alias /opt/karatdesk/.runtime/public/assets/;
  expires 1y;
  add_header Cache-Control "public, immutable";
  add_header X-Content-Type-Options nosniff;
}

# Expose only the Supabase APIs used by KaratDesk. Studio and all other gateway
# routes remain private. The gateway itself is bound to 127.0.0.1:8000.
location = /sb { return 404; }
location = /sb/ { return 404; }

location ^~ /sb/auth/v1/ {
  # A URI on proxy_pass replaces only the matched /sb/auth/v1/ prefix.
  # /sb/auth/v1/token therefore reaches the gateway as /auth/v1/token.
  proxy_pass http://127.0.0.1:8000/auth/v1/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Prefix /sb;
  proxy_set_header Connection "";
}

location ^~ /sb/rest/v1/ {
  proxy_pass http://127.0.0.1:8000/rest/v1/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Prefix /sb;
  proxy_set_header Connection "";
}

location ^~ /sb/storage/v1/ {
  proxy_pass http://127.0.0.1:8000/storage/v1/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Prefix /sb;
  proxy_set_header Connection "";
  proxy_request_buffering off;
}

location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Connection "";
}
